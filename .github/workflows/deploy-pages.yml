name: Deploy to GitHub Pages

# Builds the client SPA and publishes it to GitHub Pages on every push to the
# working branch. The build sets DEPLOY_TARGET=gh-pages so Vite uses the
# /SurviveV1/ base path, and copies index.html to 404.html so client-side deep
# links (e.g. /command, /investigations) survive a hard refresh.

on:
  push:
    branches: [claude/osint-tracking-app-SM6qf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
