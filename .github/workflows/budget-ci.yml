name: budget-ci

on:
  push:
    branches: ['claude/budgeting-app-research-build-qbwbm1']
  pull_request:
    branches: ['budgeting-app-base']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx expo export --platform web
      - run: npx expo prebuild --no-install --clean --platform android
      - run: npx expo prebuild --no-install --clean --platform ios
