{% extends "base.html" %}
{% block title %}{{ note.title }}{% endblock %}

{% block head %}
<style>
  .note-body { font-size:15px; line-height:1.6; }
  .note-body h1 { font-size:24px; margin:0 0 12px; }
  .note-body h2 { font-size:19px; margin:20px 0 8px; }
  .note-body h3, .note-body h4, .note-body h5, .note-body h6 { font-size:16px; margin:16px 0 6px; }
  .note-body p { margin:0 0 12px; }
  .note-body ul, .note-body ol { margin:0 0 12px 22px; }
  .note-body li.done { color:var(--text-dim); text-decoration:line-through; }
  .note-body code { background:var(--surface2); padding:1px 5px; border-radius:4px; font-family:var(--mono); font-size:13px; }
  .note-body pre { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; overflow:auto; }
  .note-body pre code { background:none; padding:0; }
  .note-body blockquote { border-left:3px solid var(--accent2); margin:0 0 12px; padding:4px 12px; color:var(--text-dim); }
  .note-body hr { border:none; border-top:1px solid var(--border); margin:16px 0; }
  .note-body a { color:var(--accent2); }
  .note-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:16px 0; }
</style>
{% endblock %}

{% block content %}
<div class="container">
  <div class="note-actions">
    <a href="/notes" class="btn btn-secondary btn-sm">&larr; All notes</a>
    <a href="/notes/{{ note.slug }}?edit=1" class="btn btn-primary btn-sm">&#9998; Edit</a>
    {% if is_admin %}
    <form method="post" action="/notes/{{ note.slug }}/delete" onsubmit="return confirm('Delete this note?');" style="margin:0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-secondary btn-sm" style="color:var(--danger);">Delete</button>
    </form>
    {% endif %}
    <span style="font-size:12px;color:var(--text-dim);margin-left:auto;font-family:var(--mono);">
      {{ note.slug }}.md &middot; {{ note.modified }}
    </span>
  </div>
  <div class="card note-body">{{ rendered|safe }}</div>
</div>
{% endblock %}
