# SurviveV1 — serve time to hotspot clients (installed to
# /etc/chrony/conf.d/survive.conf by setup/install.sh).
#
# Grid-down, there is no upstream time source, yet phones and the Pi still
# drift — and wrong time breaks HTTPS certificate validation, log ordering,
# and app sessions. `local stratum 10` makes chrony serve its own clock as a
# valid time source EVEN WHEN UNSYNCHRONIZED, so every device on the hotspot
# agrees on the Pi's time. That is strictly better than "no time at all".
#
# For real accuracy after a power loss, fit the Pi 5 RTC battery (~$5, the
# official part) — without it the clock resets to the last-known time on boot.

# Answer NTP queries from the hotspot subnet only.
allow 10.42.0.0/24

# Serve local time as stratum 10 even with no upstream sync.
local stratum 10
