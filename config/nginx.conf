# SurviveV1 — Nginx reverse proxy configuration
# All services accessible via http://survive.local/

server {
    listen 80 default_server;
    server_name survive.local survive _;

    access_log /var/log/nginx/survive_access.log;
    error_log  /var/log/nginx/survive_error.log;

    # Security headers. X-XSS-Protection is intentionally omitted: it is
    # deprecated and can introduce vulnerabilities in legacy browsers; the
    # Flask app ships a Content-Security-Policy instead.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # AI chat streams token-by-token (NDJSON). Buffering must be off or nginx
    # holds the whole response until the model finishes, defeating streaming.
    location /api/ai/chat {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }

    # Main dashboard
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    # Kiwix (Wikipedia, books)
    location /wiki/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
    }

    # Kolibri (Khan Academy)
    location /learn/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_set_header Host $host;
    }

    # Calibre-Web (E-book library)
    location /books/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # Jellyfin (Videos)
    location /videos/ {
        proxy_pass http://127.0.0.1:8096/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Maps
    location /maps/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
    }

    # Direct file serving (large files)
    location /files/ {
        alias /mnt/survive/;
        autoindex off;
        sendfile on;
        tcp_nopush on;
    }
}
